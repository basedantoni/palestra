# Over-engineering review on request: ask `palestra-bot` to review a PR and it
# posts a ponytail-review (prompt: .github/ponytail-review.md) via OpenRouter.
# Setup: machine user `palestra-bot` as repo collaborator; secret BOT_PAT (its
# token, pull requests write). OpenRouter auth is keyless: the job's GitHub OIDC
# token is exchanged under an OpenRouter workload identity policy with issuer
# https://token.actions.githubusercontent.com, audience `openrouter`, subject
# `repo:basedantoni/palestra:pull_request`. Swap MODEL freely.
name: ponytail-review

on:
  pull_request:
    types: [review_requested]

jobs:
  review:
    if: github.event.requested_reviewer.login == 'palestra-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Review diff
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          OPENROUTER_POLICY_ID: 00000000-0000-0000-0000-000000000000 # TODO: federation policy UUID
          MODEL: anthropic/claude-sonnet-5.5
          PR: ${{ github.event.pull_request.number }}
        run: |
          github_jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openrouter" | jq -er .value)
          OPENROUTER_API_KEY=$(curl -sS https://openrouter.ai/api/v1/oauth/token \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "subject_token=$github_jwt" \
            --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            --data-urlencode "federation_policy_id=$OPENROUTER_POLICY_ID" \
            | jq -er '.access_token // error("OpenRouter exchange: \(.error_description)")')
          echo "::add-mask::$OPENROUTER_API_KEY"

          gh pr diff "$PR" > pr.diff
          # ponytail: diff capped at 200k chars, chunk per file if big PRs get truncated
          jq -n --rawfile skill .github/ponytail-review.md --rawfile diff pr.diff --arg model "$MODEL" \
            '{model: $model, messages: [
              {role: "system", content: $skill},
              {role: "user", content: ("Review this diff:\n\n" + $diff[:200000])}]}' \
          | curl -sSf https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -H "Content-Type: application/json" -d @- \
          | jq -er '.choices[0].message.content' > review.md
          gh pr review "$PR" --comment -F review.md
